<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neon Arcade OS - TESTE</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            background: #0b1120; 
            color: #00feff; 
            font-family: Arial, sans-serif; 
            overflow: hidden;
        }
       .tela { 
            display: none; 
            width: 100vw; 
            height: 100vh; 
            position: fixed; 
            top: 0; 
            left: 0;
            justify-content: center;
            align-items: center;
            flex-direction: column;
        }
       .tela.ativa { display: flex; }
       .btn { 
            background: #00feff; 
            color: #000; 
            border: none; 
            padding: 15px 30px; 
            font-size: 16px; 
            margin: 10px;
            cursor: pointer;
            border-radius: 5px;
        }
       .btn:hover { background: #39ff14; }
        #canvas { 
            border: 2px solid #00feff; 
            background: #000;
        }
       .header {
            position: absolute;
            top: 10px;
            width: 100%;
            display: flex;
            justify-content: space-between;
            padding: 0 20px;
        }
       .header button {
            background: none;
            border: 1px solid #f44;
            color: #f44;
            padding: 5px 10px;
        }
    </style>
</head>
<body>
    <div id="tela-inicial" class="tela ativa">
        <h1 style="font-size: 32px; margin-bottom: 20px;">NEON ARCADE</h1>
        <div>INICIANDO SISTEMA...</div>
        <div id="loading" style="width: 200px; height: 10px; background: #222; margin: 20px;">
            <div id="barra" style="width: 0%; height: 100%; background: #00feff; transition: width 1s;"></div>
        </div>
    </div>

    <div id="tela-menu" class="tela">
        <h2 style="margin-bottom: 30px;">SELECIONE O JOGO</h2>
        <button class="btn" onclick="iniciarJogo()">🐍 TESTE COBRINHA</button>
    </div>

    <div id="tela-jogo" class="tela">
        <div class="header">
            <button onclick="voltarMenu()">SAIR</button>
            <div>PONTOS: <span id="score">0</span></div>
            <button onclick="alert('Pausado')">PAUSAR</button>
        </div>
        <canvas id="canvas" width="300" height="400"></canvas>
        <div id="gameover" style="display: none; position: absolute; text-align: center;">
            <h2 style="color: #f44;">GAME OVER</h2>
            <button class="btn" onclick="iniciarJogo()">JOGAR DE NOVO</button>
        </div>
    </div>

<script>
console.log("SISTEMA INICIADO");

let telaInicial = document.getElementById('tela-inicial');
let telaMenu = document.getElementById('tela-menu');
let telaJogo = document.getElementById('tela-jogo');
let barra = document.getElementById('barra');

function mostrarTela(nome) {
    document.querySelectorAll('.tela').forEach(t => t.classList.remove('ativa'));
    document.getElementById(nome).classList.add('ativa');
}

// Loading fake de 1.5s
setTimeout(() => {
    barra.style.width = '100%';
    setTimeout(() => {
        mostrarTela('tela-menu');
    }, 1000);
}, 500);

// JOGO TESTE - Quadrado que anda
let canvas = document.getElementById('canvas');
let ctx = canvas.getContext('2d');
let x = 150, y = 200, pontos = 0;
let rodando = false;

function iniciarJogo() {
    console.log("JOGO INICIADO");
    mostrarTela('tela-jogo');
    document.getElementById('gameover').style.display = 'none';
    x = 150; y = 200; pontos = 0;
    rodando = true;
    loop();
}

function voltarMenu() {
    rodando = false;
    mostrarTela('tela-menu');
}

function loop() {
    if (!rodando) return;
    
    // Limpa
    ctx.fillStyle = '#000';
    ctx.fillRect(0, 0, 300, 400);
    
    // Desenha player
    ctx.fillStyle = '#39ff14';
    ctx.fillRect(x, y, 20);
    
    // Move
    y += 2;
    if (y > 400) {
        y = 0;
        pontos += 10;
        document.getElementById('score').innerText = pontos;
    }
    
    // Game over se bater embaixo
    if (y > 380) {
        rodando = false;
        document.getElementById('gameover').style.display = 'block';
        return;
    }
    
    requestAnimationFrame(loop);
}

// Controles touch
canvas.addEventListener('touchstart', (e) => {
    let toque = e.touches[0].clientX;
    if (toque < window.innerWidth / 2) {
        x -= 20; // Esquerda
    } else {
        x += 20; // Direita
    }
    if (x < 0) x = 0;
    if (x > 280) x = 280;
});
</script>
</body>
</html>
