<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Neon Arcade OS - v12.1</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --neon-cyan: #00feff; --neon-pink: #ff00ff; --neon-green: #39ff14; 
            --neon-orange: #ff6b00; --bg-dark: #0b1120;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            background: var(--bg-dark); color: var(--neon-cyan); 
            font-family: 'Rajdhani', sans-serif; overflow: hidden; user-select: none;
        }
      .grid-bg {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background-image: 
                linear-gradient(rgba(0,254,255,0.1) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0,254,255,0.1) 1px, transparent 1px);
            background-size: 30px 30px; z-index: -1;
        }
      .tela { 
            display: none; width: 100vw; height: 100vh; position: fixed; top: 0; left: 0;
            justify-content: center; align-items: center; flex-direction: column;
        }
      .tela.ativa { display: flex; }
      .logo-arcade {
            font-family: 'Orbitron', sans-serif; font-size: 32px; font-weight: 900;
            color: var(--neon-pink); text-shadow: 0 0 10px var(--neon-pink);
            margin-bottom: 20px; letter-spacing: 3px; animation: pulse 2s infinite;
        }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.7; } }
        #barra-loading {
            width: 0%; height: 100%; background: var(--neon-cyan);
            box-shadow: 0 0 10px var(--neon-cyan); transition: width 1.5s ease;
        }
      .container-jogos {
            display: grid; grid-template-columns: repeat(2, 1fr);
            gap: 15px; padding: 20px; max-width: 400px;
        }
      .neon-card {
            background: rgba(0,254,255,0.05); border: 2px solid var(--neon-cyan);
            padding: 20px 15px; text-align: center; cursor: pointer; font-family: 'Orbitron';
            font-size: 11px; transition: all 0.2s;
        }
      .neon-card:active { 
            background: var(--neon-cyan); color: #000; transform: scale(0.95);
        }
      .header-jogo {
            position: absolute; top: 0; width: 100%; display: flex;
            justify-content: space-between; align-items: center;
            padding: 10px 15px; font-family: 'Orbitron'; font-size: 11px;
            background: rgba(0,0,0,0.7); z-index: 10;
        }
      .header-jogo button {
            background: none; border: 1px solid; padding: 6px 12px;
            font-family: 'Orbitron'; font-size: 10px; cursor: pointer;
        }
        #canvas { 
            border: 2px solid var(--neon-cyan); background: #000;
            box-shadow: 0 0 20px var(--neon-cyan); touch-action: none;
        }
        #painel-gameover {
            display: none; position: absolute; text-align: center;
            background: rgba(0,0,0,0.95); padding: 30px;
            border: 2px solid var(--neon-pink); z-index: 20;
        }
      .btn-principal {
            background: var(--neon-cyan); color: #000; border: none;
            padding: 12px 25px; font-family: 'Orbitron'; font-size: 12px;
            cursor: pointer; margin-top: 15px;
        }
    </style>
</head>
<body>
<div class="grid-bg"></div>

    <div id="tela-inicial" class="tela ativa">
        <h1 class="logo-arcade">NEON ARCADE</h1>
        <div style="letter-spacing: 2px; font-size: 10px; margin-bottom: 10px;">SISTEMA v12.1</div>
        <div style="width: 200px; height: 8px; background: #222; border: 2px solid var(--neon-cyan);">
            <div id="barra-loading"></div>
        </div>
    </div>

    <div id="tela-menu" class="tela">
        <h2 style="margin-bottom: 20px; font-size: 14px; font-family: 'Orbitron';">SELECIONE O MÓDULO</h2>
        <div class="container-jogos">
            <div class="neon-card" onclick="iniciarJogo('snake')">🐍 COBRINHA<br>NEON</div>
            <div class="neon-card" onclick="iniciarJogo('breakout')">🧱 BLOCOS<br>GLITCH</div>
            <div class="neon-card" onclick="iniciarJogo('flap')">🐦 NEON<br>FLAP</div>
            <div class="neon-card" onclick="iniciarJogo('space')">🚀 GALÁXIA<br>VOID</div>
        </div>
    </div>

    <div id="tela-jogo" class="tela">
        <div class="header-jogo">
            <button onclick="voltarMenu()" style="border-color: #f44; color: #f44;">SAIR</button>
            <div>
                <div id="score-live">0</div>
                <div id="record-live" style="color:#aaa; font-size: 8px;">REC: 0</div>
            </div>
            <button onclick="alternarPausa()" id="btn-pausa" style="border-color: var(--neon-cyan); color: var(--neon-cyan);">PAUSAR</button>
        </div>
        <canvas id="canvas" width="320" height="480"></canvas>
        <div id="painel-gameover">
            <h2 id="titulo-gameover" style="color:#f44; font-family: 'Orbitron';">GAME OVER</h2>
            <p id="score-final" style="margin:20px 0; color: white; font-size: 18px;"></p>
            <button class="btn-principal" onclick="reiniciarJogo()">JOGAR DE NOVO</button>
            <button class="btn-principal" style="background: var(--neon-pink);" onclick="voltarMenu()">MENU</button>
        </div>
    </div>

<script>
// ===== SISTEMA BASE =====
console.log("NEON ARCADE v12.1 - SISTEMA ONLINE");
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
let jogoAtual = null, jogoRodando = false, jogoPausado = false;
let gameLoopId = null, ultimoTempo = 0;

function mostrarTela(id) {
    document.querySelectorAll('.tela').forEach(t => t.classList.remove('ativa'));
    document.getElementById(id).classList.add('ativa');
}

window.addEventListener('load', () => {
    document.getElementById('barra-loading').style.width = '100%';
    setTimeout(() => mostrarTela('tela-menu'), 1600);
});

function iniciarJogo(nome) {
    jogoAtual = nome;
    jogoRodando = true;
    jogoPausado = false;
    mostrarTela('tela-jogo');
    document.getElementById('painel-gameover').style.display = 'none';
    document.getElementById('btn-pausa').innerText = 'PAUSAR';
    
    pararJogo();
    ultimoTempo = 0;
    
    if (nome === 'snake') initSnake();
    if (nome === 'breakout') initBreakout();
    if (nome === 'flap') initFlap();
    if (nome === 'space') initSpace();
}

function voltarMenu() {
    jogoRodando = false;
    pararJogo();
    mostrarTela('tela-menu');
}

function alternarPausa() {
    if (!jogoRodando) return;
    jogoPausado =!jogoPausado;
    document.getElementById('btn-pausa').innerText = jogoPausado? 'CONTINUAR' : 'PAUSAR';
}

function reiniciarJogo() { if (jogoAtual) iniciarJogo(jogoAtual); }

function mostrarGameOver(pontos) {
    jogoRodando = false;
    document.getElementById('score-final').innerText = `PONTOS: ${pontos}`;
    document.getElementById('painel-gameover').style.display = 'block';
    salvarRecorde(jogoAtual, pontos);
}

function atualizarPlacar(pontos) {
    document.getElementById('score-live').innerText = pontos;
    document.getElementById('record-live').innerText = `REC: ${pegarRecorde(jogoAtual)}`;
}

function pararJogo() {
    if (gameLoopId) { cancelAnimationFrame(gameLoopId); gameLoopId = null; }
}

function salvarRecorde(jogo, pontos) {
    let rec = pegarRecorde(jogo);
    if (pontos > rec) localStorage.setItem(`recorde_${jogo}`, pontos);
}

function pegarRecorde(jogo) {
    return parseInt(localStorage.getItem(`recorde_${jogo}`) || 0);
}

// ===== JOGO 1: COBRINHA NEON - VELOCIDADE CORRIGIDA =====
function initSnake() {
    const grid = 16;
    let snake = [{x: 160, y: 240}], dx = grid, dy = 0;
    let comida = {x: 80, y: 80}, pontos = 0;
    let velocidade = 100; // ms entre movimentos
    
    function loop(tempo) {
        if (!jogoRodando) return;
        gameLoopId = requestAnimationFrame(loop);
        if (jogoPausado) return;
        
        // Controla velocidade: só move a cada 100ms
        if (tempo - ultimoTempo < velocidade) return;
        ultimoTempo = tempo;
        
        let head = {x: snake[0].x + dx, y: snake[0].y + dy};
        
        // Colisão parede
        if (head.x < 0 || head.x >= 320 || head.y < 0 || head.y >= 480) {
            mostrarGameOver(pontos); return;
        }
        // Colisão corpo
        for (let s of snake) {
            if (head.x === s.x && head.y === s.y) {
                mostrarGameOver(pontos); return;
            }
        }
        
        snake.unshift(head);
        
        // Comeu
        if (head.x === comida.x && head.y === comida.y) {
            pontos += 10;
            atualizarPlacar(pontos);
            velocidade = Math.max(50, velocidade - 2); // Acelera aos poucos
            comida = {
                x: Math.floor(Math.random() * 20) * grid,
                y: Math.floor(Math.random() * 30) * grid
            };
        } else {
            snake.pop();
        }
        
        // Desenha
        ctx.fillStyle = '#000';
        ctx.fillRect(0, 0, 320, 480);
        
        ctx.fillStyle = '#39ff14';
        ctx.shadowColor = '#39ff14';
        ctx.shadowBlur = 10;
        snake.forEach(s => ctx.fillRect(s.x, s.y, grid-2, grid-2));
        
        ctx.fillStyle = '#ff00ff';
        ctx.shadowColor = '#ff00ff';
        ctx.shadowBlur = 15;
        ctx.fillRect(comida.x, comida.y, grid-2);
        ctx.shadowBlur = 0;
    }
    
    // Controles swipe
    let startX, startY;
    canvas.ontouchstart = e => {
        startX = e.touches[0].clientX;
        startY = e.touches[0].clientY;
    };
    canvas.ontouchend = e => {
        if (!startX) return;
        let diffX = e.changedTouches[0].clientX - startX;
        let diffY = e.changedTouches[0].clientY - startY;
        if (Math.abs(diffX) > Math.abs(diffY)) {
            if (diffX > 0 && dx === 0) { dx = grid; dy = 0; }
            else if (diffX < 0 && dx === 0) { dx = -grid; dy = 0; }
        } else {
            if (diffY > 0 && dy === 0) { dx = 0; dy = grid; }
            else if (diffY < 0 && dy === 0) { dx = 0; dy = -grid; }
        }
        startX = null;
    };
    
    atualizarPlacar(0);
    loop(0);
}

// ===== JOGO 2: BLOCOS GLITCH =====
function initBreakout() {
    let bola = {x: 160, y: 400, dx: 3, dy: -3, r: 6};
    let paddle = {x: 120, y: 450, w: 80, h: 10};
    let blocos = [];
    let pontos = 0;
    
    // Cria blocos
    for(let i = 0; i < 5; i++) {
        for(let j = 0; j < 8; j++) {
            blocos.push({x: j*40+4, y: i*20+40, w: 36, h: 16, vivo: true});
        }
    }
    
    function loop() {
        if (!jogoRodando) return;
        gameLoopId = requestAnimationFrame(loop);
        if (jogoPausado) return;
        
        // Move bola
        bola.x += bola.dx;
        bola.y += bola.dy;
        
        // Colisão paredes
        if (bola.x < bola.r || bola.x > 320-bola.r) bola.dx *= -1;
        if (bola.y < bola.r) bola.dy *= -1;
        if (bola.y > 480) { mostrarGameOver(pontos); return; }
        
        // Colisão paddle
        if (bola.y + bola.r > paddle.y && bola.x > paddle.x && bola.x < paddle.x + paddle.w) {
            bola.dy = -Math.abs(bola.dy);
        }
        
        // Colisão blocos
        blocos.forEach(b => {
            if (b.vivo && bola.x > b.x && bola.x < b.x+b.w && bola.y > b.y && bola.y < b.y+b.h) {
                b.vivo = false;
                bola.dy *= -1;
                pontos += 10;
                atualizarPlacar(pontos);
            }
        });
        
        // Desenha
        ctx.fillStyle = '#000';
        ctx.fillRect(0, 0, 320, 480);
        
        ctx.fillStyle = '#00feff';
        ctx.shadowColor = '#00feff';
        ctx.shadowBlur = 10;
        ctx.fillRect(paddle.x, paddle.y, paddle.w, paddle.h);
        
        ctx.beginPath();
        ctx.arc(bola.x, bola.y, bola.r, 0, Math.PI*2);
        ctx.fillStyle = '#ff00ff';
        ctx.shadowColor = '#ff00ff';
        ctx.fill();
        
        blocos.forEach(b => {
            if (b.vivo) {
                ctx.fillStyle = '#39ff14';
                ctx.shadowColor = '#39ff14';
                ctx.fillRect(b.x, b.y, b.w, b.h);
            }
        });
        ctx.shadowBlur = 0;
        
        if (blocos.every(b =>!b.vivo)) { mostrarGameOver(pontos + 500); }
    }
    
    canvas.ontouchmove = e => {
        let rect = canvas.getBoundingClientRect();
        paddle.x = e.touches[0].clientX - rect.left - paddle.w/2;
        paddle.x = Math.max(0, Math.min(320-paddle.w, paddle.x));
    };
    
    atualizarPlacar(0);
    loop();
}

// ===== JOGO 3: NEON FLAP =====
function initFlap() {
    let bird = {x: 60, y: 240, vy: 0, r: 12};
    let canos = [], pontos = 0, frame = 0;
    const gravidade = 0.5, pulo = -8;
    
    function loop() {
        if (!jogoRodando) return;
        gameLoopId = requestAnimationFrame(loop);
        if (jogoPausado) return;
        
        frame++;
        bird.vy += gravidade;
        bird.y += bird.vy;
        
        // Cria canos
        if (frame % 90 === 0) {
            let gap = 120;
            let top = Math.random() * 200 + 50;
            canos.push({x: 320, top: top, bot: top + gap, passou: false});
        }
        
        // Move canos
        canos.forEach(c => {
            c.x -= 2;
            if (!c.passou && c.x + 50 < bird.x) {
                c.passou = true;
                pontos++;
                atualizarPlacar(pontos);
            }
        });
        canos = canos.filter(c => c.x > -60);
        
        // Colisão
        if (bird.y < 0 || bird.y > 480) { mostrarGameOver(pontos); return; }
        canos.forEach(c => {
            if (bird.x + bird.r > c.x && bird.x - bird.r < c.x + 50) {
                if (bird.y - bird.r < c.top || bird.y + bird.r > c.bot) {
                    mostrarGameOver(pontos); return;
                }
            }
        });
        
        // Desenha
        ctx.fillStyle = '#001122';
        ctx.fillRect(0, 0, 320, 480);
        
        ctx.fillStyle = '#ff6b00';
        ctx.shadowColor = '#ff6b00';
        ctx.shadowBlur = 15;
        canos.forEach(c => {
            ctx.fillRect(c.x, 0, 50, c.top);
            ctx.fillRect(c.x, c.bot, 50, 480-c.bot);
        });
        
        ctx.fillStyle = '#00feff';
        ctx.shadowColor = '#00feff';
        ctx.beginPath();
        ctx.arc(bird.x, bird.y, bird.r, 0, Math.PI*2);
        ctx.fill();
        ctx.shadowBlur = 0;
    }
    
    canvas.ontouchstart = () => { bird.vy = pulo; };
    
    atualizarPlacar(0);
    loop();
}

// ===== JOGO 4: GALÁXIA VOID =====
function initSpace() {
    let nave = {x: 160, y: 400, w: 20, h: 20};
    let tiros = [], inimigos = [], pontos = 0, frame = 0;
    
    function loop() {
        if (!jogoRodando) return;
        gameLoopId = requestAnimationFrame(loop);
        if (jogoPausado) return;
        
        frame++;
        
        // Spawn inimigos
        if (frame % 60 === 0) {
            inimigos.push({x: Math.random()*300, y: 0, w: 20, h: 20});
        }
        
        // Move tiros
        tiros.forEach(t => t.y -= 5);
        tiros = tiros.filter(t => t.y > 0);
        
        // Move inimigos
        inimigos.forEach(i => i.y += 2);
        
        // Colisão tiro-inimigo
        tiros.forEach((t, ti) => {
            inimigos.forEach((i, ii) => {
                if (t.x < i.x+i.w && t.x+4 > i.x && t.y < i.y+i.h && t.y+10 > i.y) {
                    tiros.splice(ti, 1);
                    inimigos.splice(ii, 1);
                    pontos += 10;
                    atualizarPlacar(pontos);
                }
            });
        });
        
        // Colisão inimigo-nave
        inimigos.forEach(i => {
            if (i.x < nave.x+nave.w && i.x+i.w > nave.x && i.y < nave.y+nave.h && i.y+i.h > nave.y) {
                mostrarGameOver(pontos); return;
            }
        });
        
        inimigos = inimigos.filter(i => i.y < 480);
        
        // Desenha
        ctx.fillStyle = '#000';
        ctx.fillRect(0, 0, 320, 480);
        
        ctx.fillStyle = '#00feff';
        ctx.shadowColor = '#00feff';
        ctx.shadowBlur = 10;
        ctx.fillRect(nave.x, nave.y, nave.w, nave.h);
        
        ctx.fillStyle = '#ff00ff';
        tiros.forEach(t => ctx.fillRect(t.x, t.y, 4, 10));
        
        ctx.fillStyle = '#f44';
        inimigos.forEach(i => ctx.fillRect(i.x, i.y, i.w, i.h));
        ctx.shadowBlur = 0;
    }
    
    canvas.ontouchmove = e => {
        let rect = canvas.getBoundingClientRect();
        nave.x = e.touches[0].clientX - rect.left - nave.w/2;
        nave.x = Math.max(0, Math.min(320-nave.w, nave.x));
    };
    
    canvas.ontouchstart = () => {
        tiros.push({x: nave.x + nave.w/2 - 2, y: nave.y});
    };
    
    atualizarPlacar(0);
    loop();
}
</script>
</body>
</html>
