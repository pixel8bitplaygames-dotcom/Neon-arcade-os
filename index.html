<!DOCTYPE html>

<html lang="pt-br">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

    <title>Neon Arcade OS - v9.6</title>



    <link rel="manifest" href="manifest.json">

    <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/5260/5260498.png">

    <link rel="icon" type="image/png" href="https://cdn-icons-png.flaticon.com/512/5260/5260498.png">



    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">



    <style>

        *{margin:0;padding:0;box-sizing:border-box; touch-action: none; user-select: none;}

        body{

            font-family: 'Press Start 2P', 'Segoe UI', sans-serif;

            background:#020205;

            color:white;

            height:100vh;

            overflow:hidden;

            display: flex;

            align-items: center;

            justify-content: center;

            background: radial-gradient(ellipse at center, #0a0a1a 0%, #000 70%);

        }



        body::before {

            content: " "; position: absolute; top: 0; left: 0; bottom: 0; right: 0;

            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%),

                        linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06));

            z-index: 1000; background-size: 100% 4px, 4px 100%; pointer-events: none;

            animation: flicker 0.15s infinite;

        }

        @keyframes flicker { 0%, 100% { opacity: 1; } 50% { opacity: 0.98; } }



.tela { display: none; width: 100%; height: 100vh; flex-direction: column; align-items: center; justify-content: center; position: absolute; }

.ativa { display: flex; }



.logo-arcade {

            font-size: 28px;

            color: #0ff;

            text-shadow: 0 0 5px #0ff, 0 0 10px #0ff, 0 0 20px #0ff, 0 0 40px #0ff;

            text-align: center;

            margin-bottom: 20px;

            font-weight: 900;

            animation: pulseNeon 2s ease-in-out infinite;

        }

        @keyframes pulseNeon { 0%, 100% { text-shadow: 0 0 5px #0ff, 0 0 10px #0ff, 0 0 20px #0ff; } 50% { text-shadow: 0 0 10px #0ff, 0 0 20px #0ff, 0 0 40px #0ff, 0 0 60px #0ff; } }



.icon-controle {

            width: 80px;

            height: 80px;

            margin-bottom: 20px;

            filter: drop-shadow(0 0 15px #0ff);

            animation: flutuar 2s ease-in-out infinite;

        }

        @keyframes flutuar { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-15px); } }



.btn-principal {

            padding: 18px 40px;

            font-size: 14px;

            font-family: 'Press Start 2P', sans-serif;

            color: #000;

            background: #0ff;

            border: none;

            border-radius: 0px;

            cursor: pointer;

            box-shadow: 0 0 20px rgba(0,255,255,0.5), inset 0 0 0 2px #000;

            transition: 0.2s;

            z-index: 110;

            animation: btnGlow 1.5s ease-in-out infinite;

        }

        @keyframes btnGlow { 0%, 100% { box-shadow: 0 0 20px rgba(0,255,255,0.5), inset 0 0 0 2px #000; } 50% { box-shadow: 0 0 40px rgba(0,255,255,0.8), inset 0 0 0 2px #000; } }

.btn-principal:active { transform: scale(0.95); background: #fff; }



#btn-instalar {

            background: #ff6b00;

            display: none;

            margin-bottom: 20px;

            animation: btnGlow 1.5s ease-in-out infinite;

        }



.container-jogos { display: grid; grid-template-columns: 1fr; gap: 15px; width: 85%; max-width: 400px; }

.jogo-card {

            background: rgba(0,255,255,0.05);

            border: 2px solid #0ff;

            border-radius: 0px;

            padding: 20px;

            text-align: center;

            font-size: 12px;

            color: #0ff;

            cursor: pointer;

            transition: 0.3s;

            box-shadow: 0 0 10px rgba(0,255,255,0.3), inset 0 0 10px rgba(0,255,255,0.1);

        }

.jogo-card:active {

            background: rgba(0,255,255,0.2);

            box-shadow: 0 0 30px rgba(0,255,255,0.8), inset 0 0 20px rgba(0,255,255,0.3);

            transform: scale(0.98);

        }



        canvas {

            border: 3px solid #0ff;

            background: radial-gradient(circle, #0a0a1a 0%, #000 100%);

            width: 95vw;

            height: 70vh;

            max-height: 580px;

            box-shadow: 0 0 20px rgba(0,255,255,0.4), inset 0 0 20px rgba(0,255,255,0.1);

            margin-top: 60px;

            image-rendering: pixelated;

        }



     .header-jogo {

            width: 100%;

            display: flex;

            justify-content: space-between;

            padding: 12px 20px;

            position: absolute;

            top: 0;

            z-index: 10;

            background: rgba(0,0,0,0.5);

        }

        #score-live { color: #0ff; font-size: 24px; text-shadow: 0 0 10px #0ff; }

        #record-live { font-size: 8px!important; }

        #painel-gameover {

            display: none; position: absolute;

            background: rgba(5,5,15,0.98);

            padding: 30px;

            border-radius: 0px;

            border: 3px solid #f44;

            text-align: center;

            z-index: 200;

            backdrop-filter: blur(15px);

            width: 85%; max-width: 320px;

            box-shadow: 0 0 30px rgba(255,68,68,0.6);

        }

        #titulo-gameover { font-size: 16px!important; }

        #score-final { font-size: 12px!important; }

    </style>

</head>

<body>



    <div id="tela-inicial" class="tela ativa">

        <img class="icon-controle" src="https://cdn-icons-png.flaticon.com/512/5260/5260498.png" alt="Pinky">

        <h1 class="logo-arcade">NEON ARCADE</h1>

        <button id="btn-instalar" class="btn-principal">📲 ADICIONAR A TELA INICIAL</button>

        <button class="btn-principal" onclick="irParaLoading('menu')">INICIAR</button>

    </div>



    <div id="tela-loading" class="tela">

        <div style="color: #0ff; letter-spacing: 2px; font-size: 10px;">UPDATING SYSTEM...</div>

        <div style="width: 200px; height: 8px; background: #222; margin-top: 20px; border: 2px solid #0ff; overflow: hidden;">

            <div id="barra" style="width: 0%; height: 100%; background: #0ff; box-shadow: 0 0 10px #0ff;"></div>

        </div>

    </div>



    <div id="tela-menu" class="tela">

        <h2 style="margin-bottom: 20px; color: #0ff; font-size: 14px;">SELECIONE O MODULO</h2>

        <div class="container-jogos">

            <div class="jogo-card" onclick="irParaLoading('snake')">🐍 NEON SNAKE</div>

            <div class="jogo-card" onclick="irParaLoading('breakout')">🧱 CYBER BLOCKS</div>

            <div class="jogo-card" onclick="irParaLoading('space')">🚀 GALAXY DEFENDER</div>

        </div>

    </div>



    <div id="tela-jogo" class="tela">

        <div class="header-jogo">

            <button onclick="irParaMenuDireto()" style="background:none; border:none; color:#f44; font-family: 'Press Start 2P'; font-size: 10px;">SAIR</button>

            <div style="text-align:center">

                <div id="score-live">0</div>

                <div id="record-live" style="color:#aaa;">RECORDE: 0</div>

            </div>

            <button onclick="alternarPausa()" id="btn-pausa" style="background:none; border:none; color:#0ff; font-family: 'Press Start 2P'; font-size: 10px;">PAUSAR</button>

        </div>

        <canvas id="canvas" width="400" height="550"></canvas>

        <div id="painel-gameover">

            <h2 id="titulo-gameover" style="color:#f44;">SISTEMA FALHOU</h2>

            <p id="score-final" style="margin:20px 0; color: white;"></p>

            <button class="btn-principal" onclick="reiniciarJogo()">REPETIR</button>

        </div>

    </div>



    <script>

        const canvas = document.getElementById('canvas'), ctx = canvas.getContext('2d');

        let jogoAtivo = "", pausado = false, pontos = 0, recorde = 0, particulas = [], animFrameId, timeoutId, gameOverAtivo = false;

        let tStartX = 0, tStartY = 0, mudouDirecaoNesteFrame = false, estrelas = [];

        let eventoInstalar = null;



        // === PWA - ADICIONAR A TELA INICIAL ===

        window.addEventListener('beforeinstallprompt', (e) => {

            e.preventDefault();

            eventoInstalar = e;

            document.getElementById('btn-instalar').style.display = 'block';

        });



        document.getElementById('btn-instalar').addEventListener('click', async () => {

            if (!eventoInstalar) return;

            eventoInstalar.prompt();

            await eventoInstalar.userChoice;

            eventoInstalar = null;

            document.getElementById('btn-instalar').style.display = 'none';

        });



        function setNeon(color, blur = 10) { ctx.shadowBlur = blur; ctx.shadowColor = color; ctx.fillStyle = color; ctx.strokeStyle = color; }

        function resetNeon() { ctx.shadowBlur = 0; }



        let audioCtx;

        function initAudio() { if(!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)(); if (audioCtx.state === 'suspended') audioCtx.resume(); }

        function bip(f, t, d, v=0.05) { if(!audioCtx) return; try { const o = audioCtx.createOscillator(), g = audioCtx.createGain(); o.type = t; o.frequency.setValueAtTime(f, audioCtx.currentTime); g.gain.setValueAtTime(v, audioCtx.currentTime); g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + d); o.connect(g); g.connect(audioCtx.destination); o.start(); o.stop(audioCtx.currentTime + d); } catch(e){} }



        function criarExplosao(x, y, cor) { for(let i=0; i<20; i++) particulas.push({ x, y, vx:(Math.random()-0.5)*15, vy:(Math.random()-0.5)*15, vida:1, cor, g: 0.15, size: 2 + Math.random()*3 }); }

        function desenharParticulas() { particulas.forEach((p, i) => { p.x+=p.vx; p.y+=p.vy; p.vy+=p.g; p.vida-=0.02; if(p.vida<=0) particulas.splice(i,1); else { setNeon(`rgba(${p.cor},${p.vida})`, 5); ctx.fillRect(p.x,p.y,p.size||3,p.size||3); resetNeon(); } }); }

        function moverEstrelas() { ctx.fillStyle = "rgba(255,255,255,0.3)"; estrelas.forEach(est => { ctx.beginPath(); ctx.arc(est.x, est.y, est.s, 0, Math.PI*2); ctx.fill(); if(jogoAtivo === 'space') { est.y += est.s * 2; if(est.y > 550) est.y = 0; } }); }



        // --- SNAKE ---

        let snk, mc, sDx, sDy, sV;

        function iniciarSnake() {

            cancelAnimationFrame(animFrameId); clearTimeout(timeoutId);

            jogoAtivo='snake'; pontos=0; sDx=1; sDy=0; sV=150; snk=[{x:10,y:10},{x:9,y:10}]; mc={x:15,y:15};

            gameOverAtivo = false; pausado = false; document.getElementById('painel-gameover').style.display='none';

            carregarRecorde(); loopSnake();

        }

        function desenharRostoCobra(x, y) {

            setNeon("#0ff", 15);

            ctx.fillRect(x*20+1, y*20+1, 18, 18);

            ctx.fillStyle = "#000"; let oX = sDx!== 0? (sDx > 0? 12 : 4) : 4; let oY = sDy!== 0? (sDy > 0? 12 : 4) : 4;

            ctx.fillRect(x*20+oX, y*20+oY, 4, 4); if(sDx!== 0) ctx.fillRect(x*20+oX, y*20+(oY === 4? 12 : 4), 4, 4); else ctx.fillRect(x*20+(oX === 4? 12 : 4), y*20+oY, 4, 4);

            if(Math.floor(Date.now()/300) % 2 === 0) { ctx.fillStyle = "#f44"; let lX = x*20+10, lY = y*20+10; if(sDx > 0) ctx.fillRect(lX+10, lY-2, 6, 4); else if(sDx < 0) ctx.fillRect(lX-16, lY-2, 6, 4); else if(sDy > 0) ctx.fillRect(lX-2, lY+10, 4, 6); else if(sDy < 0) ctx.fillRect(lX-2, lY-16, 4, 6); }

            resetNeon();

        }

        function loopSnake() {

            if(pausado || jogoAtivo!== 'snake' || gameOverAtivo) return;

            mudouDirecaoNesteFrame = false; ctx.clearRect(0,0,400,550); moverEstrelas(); desenharParticulas();

            setNeon("#f44", 15); ctx.beginPath(); ctx.arc(mc.x*20+10, mc.y*20+10, 8, 0, Math.PI*2); ctx.fill(); resetNeon();

            snk.forEach((p, i) => { if(i===0) desenharRostoCobra(p.x, p.y); else { setNeon("#0aa", 5); ctx.fillRect(p.x*20+2, p.y*20+2, 16, 16); resetNeon(); } });

            let h={x:snk[0].x+sDx, y:snk[0].y+sDy};

            if(h.x<0||h.x>=20||h.y<0||h.y>=27||snk.some(s=>s.x===h.x&&s.y===h.y)){ gameOver(); return; }

            snk.unshift(h); if(h.x===mc.x&&h.y===mc.y){ pontos+=10; criarExplosao(h.x*20+10,h.y*20+10,"255,68,68"); mc={x:Math.floor(Math.random()*20),y:Math.floor(Math.random()*25)}; bip(440,'sine',0.1); if(sV > 70) sV -= 2; } else snk.pop();

            document.getElementById('score-live').textContent=pontos; timeoutId=setTimeout(loopSnake,sV);

        }



        // --- BREAKOUT ---

        let padX, bX, bY, bDX, bDY, brks=[], lBk=1;

        function iniciarBreakout(reset) {

            cancelAnimationFrame(animFrameId); if(reset){pontos=0; lBk=1;}

            jogoAtivo='breakout'; padX=155; bX=200; bY=400; bDX=4; bDY=-4;

            gameOverAtivo = false; pausado = false; document.getElementById('painel-gameover').style.display='none';

            carregarRecorde(); brks=[]; for(let c=0; c<5; c++){ brks[c]=[]; for(let r=0; r<6; r++){ let a = (Math.random() > 0.3)? 1 : 0; brks[c][r]={s:a, c:`hsl(${(r*40) + (lBk*30)},100%,60%)`}; }} loopBreakout();

        }

        function loopBreakout() {

            if(pausado || jogoAtivo!=='breakout' || gameOverAtivo) return; ctx.clearRect(0,0,400,550); moverEstrelas(); desenharParticulas();

            for(let c=0; c<5; c++){ for(let r=0; r<6; r++){ let b=brks[c][r]; if(b.s){ let bx=c*78+10, by=r*25+80; setNeon(b.c, 10); ctx.fillRect(bx,by,70,20); resetNeon(); if(bX>bx && bX<bx+70 && bY>by && bY<by+20){ bDY*=-1; b.s=0; pontos+=15; criarExplosao(bx+35,by+10,"0,255,255"); bip(600,'square',0.05); } } }}

            if(!brks.flat().some(b=>b.s)){ lBk++; iniciarBreakout(false); return; }

            setNeon("#fff", 15); ctx.beginPath(); ctx.arc(bX,bY,8,0,Math.PI*2); ctx.fill(); resetNeon(); setNeon("#0ff", 20); ctx.fillRect(padX,520,90,12); resetNeon(); bX+=bDX; bY+=bDY; if(bX<8||bX>392) bDX*=-1; if(bY<10) bDY*=-1; if(bY>515 && bY<535 && bX>padX && bX<padX+90){ bY=515; bDY=-Math.abs(bDY); bip(300,'sine',0.05); } if(bY>550){ gameOver(); return; }

            document.getElementById('score-live').textContent=pontos; animFrameId = requestAnimationFrame(loopBreakout);

        }



        // --- SPACE ---

        let nX, ts=[], ins=[], fI=0, caixas=[], powerUp=0;

        function iniciarSpace() {

            cancelAnimationFrame(animFrameId); jogoAtivo='space'; pontos=0; nX=175; ts=[]; ins=[]; caixas=[]; fI=0; powerUp=0;

            gameOverAtivo = false; pausado = false; document.getElementById('painel-gameover').style.display='none';

            document.getElementById('titulo-gameover').textContent = "SISTEMA FALHOU";

            carregarRecorde(); loopSpace();

        }

        function desenharNaveStilosa(x, y, p) {

            const power = p > 0;

            if(power) { setNeon("#f0f", 25 + Math.sin(fI*0.3)*10); } else { setNeon("#f44", 20); }

            ctx.fillRect(x+20, y, 10, 10);

            ctx.fillRect(x+15, y+10, 20, 10);

            ctx.fillRect(x+10, y+20, 30, 15);

            ctx.fillRect(x, y+35, 50, 10);

            setNeon("#0ff", 10);

            ctx.fillRect(x+22, y+15, 6, 6);

            if(Math.floor(fI/4) % 2 === 0) {

                setNeon("#ff0", 15);

                ctx.fillRect(x+20, y+45, 10, 12);

                setNeon("#f80", 10);

                ctx.fillRect(x+22, y+50, 6, 8);

            }

            resetNeon();

        }

        function desenharMeteoro(inv) {

            ctx.save();

            ctx.translate(inv.x+17, inv.y+17);

            ctx.rotate(inv.rot);

            inv.rot += inv.rotV;

            setNeon("#888", 15);

            ctx.beginPath();

            ctx.moveTo(0, -20); ctx.lineTo(14, -14); ctx.lineTo(20, 0); ctx.lineTo(14, 14);

            ctx.lineTo(0, 20); ctx.lineTo(-14, 14); ctx.lineTo(-20, 0); ctx.lineTo(-14, -14);

            ctx.closePath(); ctx.fill();

            setNeon("#444", 5);

            ctx.beginPath(); ctx.arc(-6, -4, 3, 0, Math.PI*2); ctx.fill();

            ctx.beginPath(); ctx.arc(4, 6, 4, 0, Math.PI*2); ctx.fill();

            resetNeon();

            ctx.restore();

        }

        function desenharBonusBateria(x, y) {

            if(Math.floor(fI/8) % 2 === 0) {

                setNeon("#f0f", 25);

                ctx.strokeStyle = "#f0f"; ctx.lineWidth = 2;

                ctx.strokeRect(x-4, y-4, 28, 38);

            }

            setNeon("#f0f", 20);

            ctx.beginPath();

            ctx.moveTo(x+10, y); ctx.lineTo(x+20, y+10); ctx.lineTo(x+15, y+30);

            ctx.lineTo(x+5, y+30); ctx.lineTo(x, y+10); ctx.closePath(); ctx.fill();

            setNeon("#fff", 10);

            ctx.fillRect(x+8, y+8, 4, 8);

            resetNeon();

        }

        function loopSpace() {

            if(pausado||jogoAtivo!=='space'||gameOverAtivo) return;

            ctx.clearRect(0,0,400,550); moverEstrelas(); desenharParticulas();

            desenharNaveStilosa(nX, 480, powerUp);

            let cad=powerUp>0?6:18;

            if(fI%cad===0){ ts.push({x:nX+22,y:470}); bip(800,'sine',0.02,0.01); }

            if(powerUp>0) powerUp--;

            ts.forEach((t,i)=>{ t.y-=12; setNeon("#fff", 10); ctx.fillRect(t.x,t.y,6,15); resetNeon(); if(t.y<0) ts.splice(i,1); });

            if(fI%45===0) ins.push({ x:Math.random()*360, y:-40, v:3+(pontos/1500), rot: Math.random()*Math.PI*2, rotV: (Math.random()-0.5)*0.05 });

            ins.forEach((inv,i)=>{

                inv.y+=inv.v; desenharMeteoro(inv);

                if(inv.y > 540) { document.getElementById('titulo-gameover').textContent = "DEFESA FALHOU"; gameOver(); return; }

                ts.forEach((t,ti)=>{ if(t.x>inv.x&&t.x<inv.x+35&&t.y>inv.y&&t.y<inv.y+35){ ins.splice(i,1); ts.splice(ti,1); pontos+=20; criarExplosao(inv.x+17,inv.y+17,"255,0,255"); bip(200,'sawtooth',0.05); } });

                if(inv.y>460 && inv.y<520 && inv.x>nX-10 && inv.x<nX+50){ document.getElementById('titulo-gameover').textContent = "SISTEMA FALHOU"; gameOver(); return; }

            });

            if(fI%400===0) caixas.push({x:Math.random()*360,y:-40});

            caixas.forEach((c,i)=>{ c.y+=2.5; desenharBonusBateria(c.x, c.y); if(c.y>470 && c.y<520 && c.x>nX-5 && c.x<nX+55){ powerUp=200; caixas.splice(i,1); bip(1200,'sine',0.2); } });

            fI++; document.getElementById('score-live').textContent=pontos; animFrameId = requestAnimationFrame(loopSpace);

        }



        // --- SISTEMA ---

        function gameOver() {

            gameOverAtivo = true; cancelAnimationFrame(animFrameId); clearTimeout(timeoutId);

            salvarRecorde(); bip(100, 'sawtooth', 0.5, 0.1);

            document.getElementById('score-final').textContent = "PONTOS: " + pontos;

            document.getElementById('painel-gameover').style.display = 'block';

        }

        function reiniciarJogo() {

            gameOverAtivo = false; pausado = false; particulas = [];

            document.getElementById('painel-gameover').style.display = 'none';

            if(jogoAtivo === 'snake') iniciarSnake();

            else if(jogoAtivo === 'breakout') iniciarBreakout(true);

            else if(jogoAtivo === 'space') iniciarSpace();

        }

        function salvarRecorde() { if(pontos > recorde) { recorde = pontos; localStorage.setItem("recorde_" + jogoAtivo, recorde); document.getElementById('record-live').textContent = "RECORDE: " + recorde; } }

        function carregarRecorde() { recorde = localStorage.getItem("recorde_" + jogoAtivo) || 0; document.getElementById('record-live').textContent = "RECORDE: " + recorde; }

        function irParaMenuDireto() { cancelAnimationFrame(animFrameId); clearTimeout(timeoutId); jogoAtivo = ""; document.querySelectorAll('.tela').forEach(t => t.classList.remove('ativa')); document.getElementById('tela-menu').classList.add('ativa'); document.getElementById('painel-gameover').style.display = 'none'; }

        function irParaLoading(dest) {

            initAudio(); if(estrelas.length===0) { for(let i=0; i<50; i++) estrelas.push({x: Math.random()*400, y: Math.random()*550, s: Math.random()*2}); }

            cancelAnimationFrame(animFrameId); clearTimeout(timeoutId);

            document.querySelectorAll('.tela').forEach(t => t.classList.remove('ativa')); document.getElementById('tela-loading').classList.add('ativa');

            let p = 0; const barra = document.getElementById('barra'); const intv = setInterval(() => { p += 10; barra.style.width = p + '%'; if(p >= 100) { clearInterval(intv); document.getElementById('tela-loading').classList.remove('ativa'); if(dest === 'menu') document.getElementById('tela-menu').classList.add('ativa'); else { document.getElementById('tela-jogo').classList.add('ativa'); if(dest==='snake') iniciarSnake(); else if(dest==='breakout') iniciarBreakout(true); else iniciarSpace(); } } }, 30);

        }

        function alternarPausa() { if(gameOverAtivo) return; pausado =!pausado; document.getElementById('btn-pausa').textContent = pausado? "VOLTAR" : "PAUSAR"; if(!pausado) { if(jogoAtivo==='snake') loopSnake(); else if(jogoAtivo==='breakout') loopBreakout(); else loopSpace(); } }

        canvas.addEventListener('touchstart', e => { tStartX = e.touches[0].clientX; tStartY = e.touches[0].clientY; initAudio(); }, {passive: true});

        canvas.addEventListener('touchmove', e => { if(pausado || gameOverAtivo) return; e.preventDefault(); const rect = canvas.getBoundingClientRect(); const relX = (e.touches[0].clientX - rect.left) * (400 / rect.width); if(jogoAtivo==='snake'){ if(mudouDirecaoNesteFrame) return; const dx = e.touches[0].clientX - tStartX, dy = e.touches[0].clientY - tStartY; if(Math.abs(dx) > 30 || Math.abs(dy) > 30){ if(Math.abs(dx) > Math.abs(dy)){ let nX = dx > 0? 1 : -1; if(nX!== -sDx) { sDx = nX; sDy = 0; mudouDirecaoNesteFrame = true; } } else { let nY = dy > 0? 1 : -1; if(nY!== -sDy) { sDy = nY; sDx = 0; mudouDirecaoNesteFrame = true; } } tStartX = e.touches[0].clientX; tStartY = e.touches[0].clientY; } } else if(jogoAtivo==='breakout') padX = Math.max(0, Math.min(310, relX - 45)); else if(jogoAtivo==='space') nX = Math.max(0, Math.min(350, relX - 25)); }, {passive: false});

    </script>
