<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Neon Arcade OS - v12.2</title>
    
    <!-- CSS separado com versão pra matar cache -->
    <link rel="stylesheet" href="./css/arcade.css?v=12.2">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@400;600&display=swap" rel="stylesheet">
</head>
<body>
<div class="grid-bg"></div>

    <div id="tela-inicial" class="tela ativa">
        <h1 class="logo-arcade">NEON ARCADE</h1>
        <div style="letter-spacing: 2px; font-size: 10px; margin-bottom: 10px;">SISTEMA v12.2 MODULAR</div>
        <div style="width: 200px; height: 8px; background: #222; border: 2px solid var(--neon-cyan);">
            <div id="barra-loading"></div>
        </div>
    </div>

    <div id="tela-menu" class="tela">
        <h2 style="margin-bottom: 20px; font-size: 14px; font-family: 'Orbitron';">SELECIONE O MÓDULO</h2>
        <div class="container-jogos">
            <div class="neon-card" onclick="iniciarJogo('snake')">🐍 COBRINHA<br>NEON</div>
            <div class="neon-card" onclick="iniciarJogo('breakout')">🧱 BLOCOS<br>GLITCH</div>
            <div class="neon-card" onclick="iniciarJogo('flap')">🐦 NEON<br>FLAP</div>
            <div class="neon-card" onclick="iniciarJogo('space')">🚀 GALÁXIA<br>VOID</div>
        </div>
    </div>

    <div id="tela-jogo" class="tela">
        <div class="header-jogo">
            <button onclick="voltarMenu()" style="border-color: #f44; color: #f44;">SAIR</button>
            <div>
                <div id="score-live">0</div>
                <div id="record-live" style="color:#aaa; font-size: 8px;">REC: 0</div>
            </div>
            <button onclick="alternarPausa()" id="btn-pausa" style="border-color: var(--neon-cyan); color: var(--neon-cyan);">PAUSAR</button>
        </div>
        <canvas id="canvas" width="320" height="480"></canvas>
        <div id="painel-gameover">
            <h2 id="titulo-gameover" style="color:#f44; font-family: 'Orbitron';">GAME OVER</h2>
            <p id="score-final" style="margin:20px 0; color: white; font-size: 18px;"></p>
            <button class="btn-principal" onclick="reiniciarJogo()">JOGAR DE NOVO</button>
            <button class="btn-principal" style="background: var(--neon-pink);" onclick="voltarMenu()">MENU</button>
        </div>
    </div>

    <!-- JS separado com versão pra matar cache -->
    <script src="./js/core.js?v=12.2"></script>
    <script src="./js/effects.js?v=12.2"></script>
    <script src="./js/snake.js?v=12.2"></script>
    <script src="./js/breakout.js?v=12.2"></script>
    <script src="./js/flap.js?v=12.2"></script>
    <script src="./js/space.js?v=12.2"></script>
</body>
</html>
