<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#0a0a0a">
    <title>NEON ARCADE OS</title>
    
    <!-- Fonte Arcade -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    
    <!-- CSS -->
    <link rel="stylesheet" href="css/style.css">
    
    <!-- PWA -->
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="icons/icon-192.png">
</head>
<body>
    <!-- TELA DO MENU -->
    <div id="tela-menu" class="tela ativa">
        <header>
            <h1>NEON ARCADE OS</h1>
            <button id="btn-instalar" style="display:none;">📱 INSTALAR APP</button>
        </header>
        
        <main>
            <div id="lista-jogos"></div>
        </main>
        
        <footer>
            <p>v1.7.1 | Feito com 💚</p>
        </footer>
    </div>

    <!-- TELA DO JOGO -->
    <div id="tela-jogo" class="tela">
        <div id="hud">
            <div class="hud-info">
                <span id="score-live">0</span>
                <span id="record-live">RECORDE: 0</span>
            </div>
            <button id="btn-pausa">PAUSAR</button>
        </div>
        
        <canvas id="canvas" width="400" height="550"></canvas>
    </div>

    <!-- CORE -->
    <script src="js/core.js"></script>
</body>
</html>
