<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NEON ARCADE OS - TESTE</title>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    
    <!-- CSS INLINE - IMPOSSÍVEL DAR ERRADO -->
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            background: #0a0a0a; 
            color: #0ff; 
            font-family: 'Press Start 2P', monospace;
            overflow: hidden;
        }
        /* ESSAS 2 LINHAS MATAM A NUVEM DE PALAVRA */
        .tela { display: none; position: absolute; width: 100%; height: 100%; }
        .tela.ativa { display: flex; flex-direction: column; }
        
        #tela-menu { padding: 20px; }
        h1 { font-size: 18px; text-align: center; padding: 20px; text-shadow: 0 0 10px #0ff; }
        #lista-jogos { display: grid; gap: 15px; }
        .jogo-card { 
            background: rgba(0,255,255,0.1); 
            border: 2px solid #0ff; 
            padding: 20px; 
            text-align: center; 
            font-size: 12px;
            cursor: pointer;
        }
        #tela-jogo { background: #000; }
        #hud { 
            display: flex; 
            justify-content: space-between; 
            padding: 10px; 
            border-bottom: 2px solid #0ff;
            font-size: 10px;
        }
        #canvas { 
            display: block; 
            margin: 20px auto; 
            border: 2px solid #0ff; 
            background: #0a0a0a;
        }
    </style>
</head>
<body>
    <!-- TELA DO MENU -->
    <div id="tela-menu" class="tela ativa">
        <h1>NEON ARCADE OS</h1>
        <div id="lista-jogos"></div>
    </div>

    <!-- TELA DO JOGO -->
    <div id="tela-jogo" class="tela">
        <div id="hud">
            <span id="score-live">0</span>
            <button id="btn-pausa">PAUSAR</button>
        </div>
        <canvas id="canvas" width="400" height="550"></canvas>
    </div>

    <!-- JS INLINE TAMBÉM -->
    <script>
        const JOGOS = [
          { id: 'snake', nome: '🐍 NEON SNAKE', arquivo: './games/snake.js' },
          { id: 'racer', nome: '🏎️ NEON RACER', arquivo: './games/racer.js' }
        ];

        function mostrarTela(id) {
            document.querySelectorAll('.tela').forEach(t => t.classList.remove('ativa'));
            document.getElementById(id).classList.add('ativa');
        }

        function carregarListaJogos() {
            const container = document.getElementById('lista-jogos');
            container.innerHTML = '';
            JOGOS.forEach(jogo => {
                const card = document.createElement('div');
                card.className = 'jogo-card';
                card.textContent = jogo.nome;
                card.onclick = () => alert('Jogo: ' + jogo.nome);
                container.appendChild(card);
            });
        }

        window.addEventListener('load', () => {
            carregarListaJogos();
        });
    </script>
</body>
</html>
